services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-qislearn}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-qislearn}
      POSTGRES_DB: ${POSTGRES_DB:-qislearn}
      OPENFGA_POSTGRES_DB: ${OPENFGA_POSTGRES_DB:-openfga}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./infra/docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-qislearn}"]
      interval: 5s
      timeout: 5s
      retries: 10

  openfga-migrate:
    image: openfga/openfga:latest
    command: migrate
    environment:
      OPENFGA_DATASTORE_ENGINE: postgres
      OPENFGA_DATASTORE_URI: postgres://${POSTGRES_USER:-qislearn}:${POSTGRES_PASSWORD:-qislearn}@postgres:5432/${OPENFGA_POSTGRES_DB:-openfga}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  openfga:
    image: openfga/openfga:latest
    restart: unless-stopped
    command: run
    environment:
      OPENFGA_DATASTORE_ENGINE: postgres
      OPENFGA_DATASTORE_URI: postgres://${POSTGRES_USER:-qislearn}:${POSTGRES_PASSWORD:-qislearn}@postgres:5432/${OPENFGA_POSTGRES_DB:-openfga}?sslmode=disable
      OPENFGA_PLAYGROUND_ENABLED: "true"
    ports:
      - "${OPENFGA_API_PORT:-8080}:8080"
      - "${OPENFGA_PLAYGROUND_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      openfga-migrate:
        condition: service_completed_successfully
    # The image is Chainguard's distroless "static" base — no shell, wget,
    # or curl, so a CMD-SHELL/wget check fails immediately with "executable
    # file not found" (confirmed via `docker inspect`/exec). It does bundle
    # a grpc_health_probe binary though (checked via `docker history`),
    # which needs no shell — use that against the gRPC port instead.
    healthcheck:
      test: ["CMD", "/usr/local/bin/grpc_health_probe", "-addr=localhost:8081"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    image: node:22
    restart: unless-stopped
    working_dir: /workspace
    # Runs as root (simplest inside node:22 — an arbitrary non-root UID has
    # no passwd entry, breaking corepack/HOME-dependent tooling), so `pnpm
    # install` leaves root-owned files in the bind-mounted repo. chown back
    # to the host user on every start (set HOST_UID/HOST_GID in .env if
    # they're not 1001:1001 — `id -u`/`id -g` on the host), or `pnpm
    # typecheck` etc. on the host fail with EACCES after the container has
    # run even once — this bit us for real.
    command: sh -c "corepack enable && pnpm install && chown -R ${HOST_UID:-1001}:${HOST_GID:-1001} /workspace && pnpm --filter @qislearn/api dev"
    # Base config comes from apps/api/.env (copy from apps/api/.env.example).
    # The environment: block below overrides only the values that must
    # differ inside the docker network vs. host-based dev (env_file values
    # win unless also listed in environment:, which then takes precedence).
    env_file:
      - apps/api/.env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-qislearn}:${POSTGRES_PASSWORD:-qislearn}@postgres:5432/${POSTGRES_DB:-qislearn}
      OPENFGA_API_URL: http://openfga:8080
    ports:
      - "4000:4000"
    volumes:
      - .:/workspace
      - pnpm_store:/root/.local/share/pnpm/store
    depends_on:
      postgres:
        condition: service_healthy
      openfga:
        condition: service_healthy

  web:
    image: node:22
    restart: unless-stopped
    working_dir: /workspace
    # See api's command above for why the chown is here.
    command: sh -c "corepack enable && pnpm install && chown -R ${HOST_UID:-1001}:${HOST_GID:-1001} /workspace && pnpm --filter @qislearn/web exec react-router dev --host 0.0.0.0"
    # Base config from apps/web/.env (copy from apps/web/.env.example).
    # QISLEARN_API_URL (server-side/loaders) is overridden below to the
    # docker-internal hostname; VITE_API_URL (browser-side) is NOT
    # overridden — it must stay a host-resolvable URL in every case, which
    # is exactly what apps/web/.env already has by default.
    env_file:
      - apps/web/.env
    environment:
      QISLEARN_API_URL: http://api:4000/graphql
    ports:
      - "5173:5173"
    volumes:
      - .:/workspace
      - pnpm_store:/root/.local/share/pnpm/store
    depends_on:
      - api

volumes:
  postgres_data:
  pnpm_store:
