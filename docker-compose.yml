services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-qislearn}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-qislearn}
      POSTGRES_DB: ${POSTGRES_DB:-qislearn}
      OPENFGA_POSTGRES_DB: ${OPENFGA_POSTGRES_DB:-openfga}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./infra/docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-qislearn}"]
      interval: 5s
      timeout: 5s
      retries: 10

  openfga-migrate:
    image: openfga/openfga:latest
    command: migrate
    environment:
      OPENFGA_DATASTORE_ENGINE: postgres
      OPENFGA_DATASTORE_URI: postgres://${POSTGRES_USER:-qislearn}:${POSTGRES_PASSWORD:-qislearn}@postgres:5432/${OPENFGA_POSTGRES_DB:-openfga}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  openfga:
    image: openfga/openfga:latest
    restart: unless-stopped
    command: run
    environment:
      OPENFGA_DATASTORE_ENGINE: postgres
      OPENFGA_DATASTORE_URI: postgres://${POSTGRES_USER:-qislearn}:${POSTGRES_PASSWORD:-qislearn}@postgres:5432/${OPENFGA_POSTGRES_DB:-openfga}?sslmode=disable
      OPENFGA_PLAYGROUND_ENABLED: "true"
    ports:
      - "${OPENFGA_API_PORT:-8080}:8080"
      - "${OPENFGA_PLAYGROUND_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      openfga-migrate:
        condition: service_completed_successfully
    # The image is Chainguard's distroless "static" base — no shell, wget,
    # or curl, so a CMD-SHELL/wget check fails immediately with "executable
    # file not found" (confirmed via `docker inspect`/exec). It does bundle
    # a grpc_health_probe binary though (checked via `docker history`),
    # which needs no shell — use that against the gRPC port instead.
    healthcheck:
      test: ["CMD", "/usr/local/bin/grpc_health_probe", "-addr=localhost:8081"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    image: node:22
    restart: unless-stopped
    working_dir: /workspace
    command: sh -c "corepack enable && pnpm install && pnpm --filter @qislearn/api dev"
    environment:
      PORT: 4000
      DATABASE_URL: postgres://${POSTGRES_USER:-qislearn}:${POSTGRES_PASSWORD:-qislearn}@postgres:5432/${POSTGRES_DB:-qislearn}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-change-me-32-chars-minimum-please}
      BETTER_AUTH_URL: http://localhost:${PORT:-4000}
      OPENFGA_API_URL: http://openfga:8080
      OPENFGA_STORE_ID: ${OPENFGA_STORE_ID:?set OPENFGA_STORE_ID in .env, see \`pnpm --filter @qislearn/authz authz:setup\`}
      OPENFGA_MODEL_ID: ${OPENFGA_MODEL_ID:?set OPENFGA_MODEL_ID in .env, see \`pnpm --filter @qislearn/authz authz:setup\`}
    ports:
      - "4000:4000"
    volumes:
      - .:/workspace
      - pnpm_store:/root/.local/share/pnpm/store
    depends_on:
      postgres:
        condition: service_healthy
      openfga:
        condition: service_healthy

  web:
    image: node:22
    restart: unless-stopped
    working_dir: /workspace
    command: sh -c "corepack enable && pnpm install && pnpm --filter @qislearn/web exec react-router dev --host 0.0.0.0"
    environment:
      QISLEARN_API_URL: http://api:4000/graphql
    ports:
      - "5173:5173"
    volumes:
      - .:/workspace
      - pnpm_store:/root/.local/share/pnpm/store
    depends_on:
      - api

volumes:
  postgres_data:
  pnpm_store:
