services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-qislearn}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-qislearn}
      POSTGRES_DB: ${POSTGRES_DB:-qislearn}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-qislearn}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
